name: Lantern Player CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Syntax-check player modules
        run: |
          node --check app.js
          node --check global-story.js
          node --check global-features.js
          node --check i18n.js
          node --check sw.js
      - name: Run dependency-free regression tests
        run: node --test tests/global-story.test.cjs tests/pack-validator.test.cjs
