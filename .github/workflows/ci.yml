name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check player JavaScript modules
        run: |
          node --check app.js
          node --check global-story.js
          node --check i18n.js
          node --check pack-validation.js
          node --check sw.js

      - name: Verify required modules exist and load before app
        run: |
          test -f global-story.js
          test -f i18n.js
          test -f pack-validation.js
          test "$(grep -n 'src="global-story.js"' index.html | cut -d: -f1)" -lt "$(grep -n 'src="i18n.js"' index.html | cut -d: -f1)"
          test "$(grep -n 'src="i18n.js"' index.html | cut -d: -f1)" -lt "$(grep -n 'src="pack-validation.js"' index.html | cut -d: -f1)"
          test "$(grep -n 'src="pack-validation.js"' index.html | cut -d: -f1)" -lt "$(grep -n 'src="app.js"' index.html | cut -d: -f1)"

      - name: Run player module regression tests
        run: node --test tests/*.test.cjs

      - name: Verify no hardcoded stop counts
        run: |
          if grep -n 'cleanSolves}/6' app.js; then
            echo "ERROR: hardcoded /6 found in leaderboard. Use pack.stops.length instead."
            exit 1
          fi

      - name: Verify teamScore guard
        run: |
          if grep -n 'solvedCount || 6' app.js; then
            echo "ERROR: teamScore guard uses || 6. Should be || 0."
            exit 1
          fi

      - name: Check for TODO/FIXME
        run: |
          if grep -rn 'TODO\|FIXME' --include='*.js' --include='*.css' --include='*.html' .; then
            echo "WARNING: TODO/FIXME found. Please resolve before merging."
            exit 1
          fi
